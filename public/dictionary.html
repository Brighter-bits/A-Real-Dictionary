<!-- templates/index.html -->
<!DOCTYPE html>
<html>
    <script>window.history.replaceState({}, "dictionary", "/dictionary");</script>
    <head>
        <link rel="icon" href="Images/RD.png"/>
        <link rel="stylesheet" href="CSS/dictButton.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dictionary</title>
    </head>
    <style>
        .round {
            border-radius: 10px;
            padding: 10px 10px 10px -100px;
            position: relative;
            top: 10px;
            left: 25%;
            width: 50%;
            height:50%;
        }
        
        .round::after{
            content: '.';
            opacity: 0;
        }

        .bin {
            width: 1%;
            height: 1%;
            left: 99%;
            position: relative;
        }

        .black{
            border: 1px #000 solid;
            font-family: Arial, Helvetica, sans-serif;
            color: black;
            
        }
        .white{
            border: 1px #fff solid;
            outline: none;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }
        .middle {
            width: 50%;
            position: relative;
            left: 25%;
            text-align: center;
        }

        .hiddenword {
            display: none;
        }

        .rectangle{
            background-color: blue;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

    </style>
    <body>
        <div style="position: absolute; display: flex; flex-direction: column; width: 20px; top: 8px">
            <button id="Home" class="button"></button>
            <button id="Settings" class="button" style="background-image: url('../Images/Settings-icon.png'); margin-top: 5px;"></button>
        </div>
        <h1 style="font-size:60px" class="middle">This is a Real Dictionary</h1>
        <h2 style="font-size:60px;" class="middle">Instantly Search For The Definition of Thousands of Words</h2>
        <div id="output_container" class="round black" style="font-size:60px; font:arial">Search...</div>
        <form id = "input_box">
            <input spellcheck="off" autocomplete="off" type="text" id="input_word" class="bin white" name="input_word" style="font-size:60px;", aria-label="Nothing here"><br>
        </form>
        <p3 id="ErrorMessage" class="middle" style="left: 38.5%; color: red; visibility: hidden;">Hey! That's not a real word, are you sure you spelt it correctly?</p3> <!-- This appears if the previously entered word was not found in the dictionary -->
        <div class="rectangle" style="width: 15vw;"></div>
        <div class="rectangle" style="width: 15vw; left:85%;"></div>
        <script type="text/javascript" src="scripts/dictScript.js" defer></script>
    </body>
</html>
