<!DOCTYPE html>
<html>
    <script>window.history.replaceState({}, "dictSettings", "/dictSettings");</script>
    <head>
        <link rel="icon" href="Images/RD.png"/>
        <link rel="stylesheet" href="CSS/dictButton.css">
    </head>
    <style>
        .rectangle{
            background-color: blue;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        .middle {
            margin: 5vw;
            width:50%;
            text-align: center;
        }
        .textbox{
            margin-left: 21.5vw;
        }
    </style>
    <body>
        <div class="rectangle" style="width: 15vw"></div>
        <div class="rectangle" style="width: 15vw; left: 85%"></div>
        <button id = "Home" class="button"></button>
        <h1 style="margin: 5vw; width:50%; text-align: center; font-size: 5vw;">Settings</h1>
        <form id="form" class="textbox">
            <div>
                <label style="margin: 20px; margin-right: 30px; text-align: center" for="firstbox">Key (What you type)</label>
                <label style="margin: 20px; margin-left:30px; text-align: center" for="secondbox">Value (What comes up)</label>
            </div>
            <div id = "placeholder"></div>
            <button id="NewItem" type="button" style="height:20px; left:30vw; margin-top:20px">Add Item</button>
            <button id="Save" type="submit" style="height:20px; left:35vw; margin-top:20px">Save Settings</button>
            <p id="status"></p>
        </form>
    </body>

    <script type="text/javascript" src="scripts/dictSettingsScript.js" defer></script>
</html>
